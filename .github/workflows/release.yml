name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для проверки упаковки, например 2026.1.0-alpha.1 (релиз не создаётся)'
        required: true
        type: string

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            python: python3
          - os: windows-latest
            runtime: win-x64
            python: python
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: ${{ matrix.python }} scripts/release.py validate --version "$REQUESTED_VERSION" --github-output "$GITHUB_OUTPUT"
      - name: Cache NuGet dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '.config/dotnet-tools.json') }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: ${{ matrix.python }} -m unittest discover -s tests/release -v
      - run: dotnet restore Jornal.Modern.slnx --locked-mode
      - name: Build
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build Jornal.Modern.slnx -c Release --no-restore -p:Version="$RELEASE_VERSION" -p:ContinuousIntegrationBuild=true
      - name: Prepare Access read fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Fixtures/New-AccessFixture.ps1 -Destination "$env:RUNNER_TEMP/journal-synthetic.mdb"
      - run: dotnet test tests/Jornal.Tests/Jornal.Tests.csproj -c Release --no-build --no-restore
      - name: Cache verified installer downloads
        if: runner.os == 'Windows'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/installer-dependencies/*.exe
          key: installer-windows-${{ hashFiles('installer/windows/dependencies.json') }}
      - name: Package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ${{ matrix.python }} scripts/release.py package --version "$RELEASE_VERSION" --runtime "${{ matrix.runtime }}" --updates
      - name: Test Linux update and restart
        if: runner.os == 'Linux'
        run: python3 scripts/test-update-install-linux.py
      - name: Test Windows install and restart
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-update-install.ps1
      - name: Test Windows offline installer and Access host
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-offline-install.ps1
      - name: Installation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.runtime }}
          path: |
            artifacts/test-results/*.trx
            artifacts/installer-logs/*.log
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.runtime }}
          path: |
            artifacts/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  native:
    name: Jet x86
    uses: ./.github/workflows/native-access.yml

  draft:
    name: Draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package, native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate version
        id: version
        env:
          REQUESTED_VERSION: ${{ github.ref_name }}
        run: python3 scripts/release.py validate --version "$REQUESTED_VERSION" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: artifacts/release
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("/tmp/release-state.json"))["isDraft"], "Published releases are not overwritten"'
            gh release upload "$RELEASE_TAG" artifacts/release/* --clobber
          else
            options=(--draft --verify-tag --title "Journal $RELEASE_VERSION" --notes-file docs/release-notes.md)
            if [[ "$IS_PRERELEASE" == true ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" artifacts/release/* "${options[@]}"
          fi
