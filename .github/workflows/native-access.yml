name: Native Access

on:
  workflow_call:

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  native:
    name: Native Jet x86
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache NuGet dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '.config/dotnet-tools.json') }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          architecture: x86
      - name: Prepare required native Jet fixture
        shell: pwsh
        run: |
          & "$env:WINDIR/SysWOW64/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -File ./tests/Fixtures/New-AccessFixture.ps1 -Destination "$env:RUNNER_TEMP/journal-synthetic-x86.mdb" -RequireProvider
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore native tests
        run: dotnet restore tests/Jornal.Access.Tests/Jornal.Access.Tests.csproj --locked-mode
      - name: Test native Access transactions
        env:
          JOURNAL_REQUIRE_NATIVE_TESTS: '1'
        run: dotnet test tests/Jornal.Access.Tests/Jornal.Access.Tests.csproj -c Release --no-restore -p:PlatformTarget=x86 --logger "trx;LogFileName=native-tests.trx" --results-directory artifacts/test-results
      - name: Native test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-native-jet
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 14
