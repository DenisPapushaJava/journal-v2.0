name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Check release tooling
        run: ${{ matrix.python }} -m unittest discover -s tests/release -v
      - run: dotnet restore Jornal.Modern.slnx --locked-mode
      - run: dotnet build Jornal.Modern.slnx -c Release --no-restore
      - name: Prepare Access read fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Fixtures/New-AccessFixture.ps1 -Destination "$env:RUNNER_TEMP/journal-synthetic.mdb"
      - run: dotnet test tests/Jornal.Tests/Jornal.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results
      - name: Package update artifacts
        shell: bash
        run: ${{ matrix.python }} scripts/release.py package --version 2026.1.0-alpha.1 --runtime ${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }} --updates
      - name: Test Linux update and restart
        if: runner.os == 'Linux'
        run: python3 scripts/test-update-install-linux.py
      - name: Test Windows install and restart
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-update-install.ps1
      - name: Update packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-packages-${{ matrix.os }}
          path: artifacts/release/*
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Set up x86 SDK for native Jet tests
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          architecture: x86
      - name: Prepare required native Jet fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:WINDIR/SysWOW64/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -File ./tests/Fixtures/New-AccessFixture.ps1 -Destination "$env:RUNNER_TEMP/journal-synthetic-x86.mdb" -RequireProvider
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native Access transactions
        if: runner.os == 'Windows'
        env:
          JOURNAL_REQUIRE_NATIVE_TESTS: '1'
        run: dotnet test tests/Jornal.Access.Tests/Jornal.Access.Tests.csproj -c Release --no-restore -p:PlatformTarget=x86 --logger "trx;LogFileName=native-tests.trx" --results-directory artifacts/test-results
      - name: Test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 7
