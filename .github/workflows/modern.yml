name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Состав проверок
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      packaging: ${{ steps.scope.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_scope.py scope

  build:
    name: Build (${{ matrix.os }})
    needs: scope
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require valid scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECK_CODE: ${{ needs.scope.outputs.code }}
          CHECK_PACKAGING: ${{ needs.scope.outputs.packaging }}
        run: ${{ matrix.python }} scripts/ci_scope.py gate
      - name: Check repository settings
        run: ${{ matrix.python }} scripts/ci_scope.py check
      - name: Cache NuGet dependencies
        id: nuget
        if: needs.scope.outputs.code == 'true' || github.event_name == 'push'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '.config/dotnet-tools.json') }}
          lookup-only: ${{ needs.scope.outputs.code != 'true' }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: needs.scope.outputs.code == 'true' || (github.event_name == 'push' && steps.nuget.outputs.cache-hit != 'true')
        with:
          global-json-file: global.json
      - name: Check release tooling
        run: ${{ matrix.python }} -m unittest discover -s tests/release -v
      - if: needs.scope.outputs.code == 'true' || (github.event_name == 'push' && steps.nuget.outputs.cache-hit != 'true')
        run: dotnet restore Jornal.Modern.slnx --locked-mode
      - name: Warm default branch tool dependencies
        if: github.event_name == 'push' && needs.scope.outputs.code == 'false' && steps.nuget.outputs.cache-hit != 'true'
        run: dotnet tool restore
      - if: needs.scope.outputs.code == 'true'
        run: dotnet build Jornal.Modern.slnx -c Release --no-restore
      - name: Prepare Access read fixture
        if: needs.scope.outputs.code == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Fixtures/New-AccessFixture.ps1 -Destination "$env:RUNNER_TEMP/journal-synthetic.mdb"
      - if: needs.scope.outputs.code == 'true'
        run: dotnet test tests/Jornal.Tests/Jornal.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results
      - name: Cache verified installer downloads
        id: installer-cache
        if: runner.os == 'Windows' && (needs.scope.outputs.packaging == 'true' || github.event_name == 'push')
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/installer-dependencies/*.exe
          key: installer-windows-${{ hashFiles('installer/windows/dependencies.json') }}
          lookup-only: ${{ needs.scope.outputs.packaging != 'true' }}
      - name: Warm default branch installer cache
        if: runner.os == 'Windows' && github.event_name == 'push' && needs.scope.outputs.packaging == 'false' && steps.installer-cache.outputs.cache-hit != 'true'
        run: python scripts/windows_installer.py --download-only
      - name: Verify installer downloads from PowerShell
        if: runner.os == 'Windows' && needs.scope.outputs.packaging == 'true'
        shell: pwsh
        run: python scripts/windows_installer.py --download-only
      - name: Package update artifacts
        if: needs.scope.outputs.packaging == 'true'
        shell: bash
        run: ${{ matrix.python }} scripts/release.py package --version 2026.1.0-alpha.1 --runtime ${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }} --updates
      - name: Test Linux update and restart
        if: needs.scope.outputs.packaging == 'true' && runner.os == 'Linux'
        run: python3 scripts/test-update-install-linux.py
      - name: Test Windows install and restart
        if: needs.scope.outputs.packaging == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-update-install.ps1
      - name: Test Windows offline installer and Access host
        if: needs.scope.outputs.packaging == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-offline-install.ps1
      - name: Update packages
        if: needs.scope.outputs.packaging == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-packages-${{ matrix.os }}
          path: artifacts/release/*
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Test results
        if: always() && needs.scope.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}
          path: |
            artifacts/test-results/*.trx
            artifacts/installer-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: Jet x86
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.code == 'true'
    uses: ./.github/workflows/native-access.yml

  checks:
    name: Check (${{ matrix.os }})
    needs: [scope, build, native]
    if: ${{ always() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: windows-latest
            python: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require all mandatory jobs
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECK_CODE: ${{ needs.scope.outputs.code }}
          CHECK_PACKAGING: ${{ needs.scope.outputs.packaging }}
          BUILD_RESULT: ${{ needs.build.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: ${{ matrix.python }} scripts/ci_scope.py jobs-gate
