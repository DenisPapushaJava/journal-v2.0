name: Диагностика времени Jet
on:
  push:
    branches: [codex/cutting-duration-design]
permissions:
  contents: read
concurrency:
  group: cutting-time-diagnostics
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
          architecture: x86
      - name: Prepare required native Jet fixture
        shell: pwsh
        run: |
          & "$env:WINDIR/SysWOW64/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -File ./tests/Fixtures/New-AccessFixture.ps1 -Destination "$env:RUNNER_TEMP/journal-synthetic-x86.mdb" -RequireProvider
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Jet diagnostics
        env:
          JOURNAL_REQUIRE_NATIVE_TESTS: '1'
        run: dotnet test tests/Jornal.Access.Tests/Jornal.Access.Tests.csproj -c Release -p:PlatformTarget=x86 --logger "trx;LogFileName=native-tests.trx" --results-directory artifacts/test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cutting-time-native-diagnostics
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
